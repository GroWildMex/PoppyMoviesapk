name: Build Poppy Movies APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build both APKs
        run: |
          gradle assemblePhoneDebug assembleFiretvDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: poppy-movies-apks
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/firetv/debug/*.apk
